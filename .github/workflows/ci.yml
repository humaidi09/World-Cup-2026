# Runs the test suite and the demo across supported Python versions.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Run the unit tests
        run: python -m pytest -q

      - name: Smoke-test the prediction engine
        run: |
          python -m worldcup teams
          python -m worldcup run --seed 1 --real-hosts
          python -m worldcup predict --sims 50 --seed 1

      - name: Run the OOP demo end to end
        run: python main.py
